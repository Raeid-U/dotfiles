# ~/dotfiles/.config/hypr/environments/nvidia.conf

# ── Graphics backend & drivers ───────────────────────────────
env = GBM_BACKEND,nvidia-drm           # wlroots GBM via NVIDIA DRM
env = LIBVA_DRIVER_NAME,nvidia         # VA-API via NVIDIA driver
env = EGL_PLATFORM,wayland             # force EGL on Wayland

# ── Vendor & offload hints ───────────────────────────────────
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,1      # for PRIME offload setups
env = __VK_LAYER_NV_optimus,NVIDIA_only

# ── SDL/Qt/Firefox tweaks ────────────────────────────────────
env = SDL_VIDEODRIVER,wayland
env = MOZ_DISABLE_RDD_SANDBOX,1

# ── Cursor & renderer fallbacks ─────────────────────────────
env = WLR_NO_HARDWARE_CURSORS,1        # avoid cursor glitches
env = WLR_RENDERER_ALLOW_SOFTWARE,1    # allow soft-fallback

cursor {
    no_hardware_cursors = true
}
